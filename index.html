 h+='<div class="card cat"><h3><span class="dz">'+c.dz+'</span>'+c.en+'</h3><p>'+c.d+'</p>';
 for(var l=1;l<=5;l++){if(LS.l&&LS.l!==l)continue;var L=W.filter(function(w){return w.t===LS.t&&w.l===l&&(LS.rare||!w.rare)});if(!L.length)continue;
  h+='<h4 class="lh">Level '+l+' · '+LV[l]+' <small>('+L.length+')</small></h4><div class="chips">';
  L.forEach(function(w){h+='<button class="chip'+(DONE[w.id]?' done':'')+'" data-id="'+w.id+'">'+w.c+'</button>'});h+='</div>'}
 h+='</div><div class="card hidden" id="explain"></div>';$('learn').innerHTML=h;
 $('rare').onchange=function(){LS.rare=this.checked?1:0;renderLearn()};updStats()}
function lp(c){return'audio/letter/'+hx(c)+'.mp3'}
function showW(w){var ex=$('explain');ex.classList.remove('hidden');
 var L='';parts(w).forEach(function(r){var c=w[r[0]];L+='<div class="lt on" data-k="'+r[0]+'" data-c="'+c+'"><b>'+(r[0]==='v'?'\u25CC'+c:c)+'</b><span class="dz">'+r[1]+'</span><small>'+r[2]+'</small></div>'});
 ex.innerHTML='<div class="big" id="bigS">'+w.c+'</div><div class="step" id="stepT">'+(w.m||'')+'</div><div class="lrow" id="lrow">'+L+'</div>'+
  (w.e&&w.e.length?'<div style="text-align:center">Words: '+w.e.map(function(x){return'<span class="ex">'+x+'</span>'}).join('')+'</div>':'')+
  (w.s&&SN[w.s]?'<div class="note">Sound guide: '+SN[w.s]+'</div>':'')+
  '<div class="row"><button class="btn amb" id="watch" type="button">&#9654; Build it slowly</button><button class="btn amb" id="diy" type="button">&#9995; Build it yourself</button><button class="btn pri" id="hr" type="button">&#128266; Hear the word</button>'+
  '<button class="btn" id="hu" type="button">Hear the root</button>'+
  '<button class="btn" id="sp" type="button">Speed: '+(LS.slow?'Slow':'Normal')+'</button></div><div class="row"><button class="btn" id="lbk" type="button">&#9664; Back</button><button class="btn pri" id="lnx" type="button" style="font-size:1.2rem;padding:.6rem 2rem">Next &#9654;</button></div>';
 $('hr').onclick=function(){hear(w.id)};$('hu').onclick=function(){hear(unitPath(w))};
 LS.diy=null;$('lrow').onclick=function(e){var t=e.target.closest('.lt');if(t)diyClick(w,t)};
 $('diy').onclick=function(){diyReset(w,1)};$('lnx').onclick=function(){go(1)};$('lbk').onclick=function(){go(-1)};
 $('sp').onclick=function(){LS.slow=LS.slow?0:1;this.textContent='Speed: '+(LS.slow?'Slow':'Normal')};
 $('watch').onclick=function(){build(w)}}
function diyReset(w,hint){clearTimeout(timer);tok++;stopAll();LS.diy={w:w,lit:{}};
 document.querySelectorAll('#lrow .lt').forEach(function(x){x.classList.remove('on','now')});
 if(hint){$('bigS').innerHTML='&nbsp;';$('stepT').textContent='Tap the letters below to build the word'}}
function diyClick(w,t){if(!LS.diy||LS.diy.w!==w)diyReset(w,0);else{clearTimeout(timer);tok++;stopAll()}
 var k=t.dataset.k,lit=LS.diy.lit,add=!lit[k],ps=parts(w).map(function(r){return r[0]});
 document.querySelectorAll('#lrow .lt').forEach(function(x){x.classList.remove('now')});
 if(add){lit[k]=w[k];t.classList.add('on','now')}else{delete lit[k];t.classList.remove('on')}
 var n=Object.keys(lit).length,all=ps.every(function(q){return lit[q]});
 var nb=$('lnx');if(nb)nb.classList.remove('pulse');
 $('stepT').textContent=all?'':(n?'Tap the next letter':'Tap the letters below to build the word');
 var upd=function(){if(!LS.diy||LS.diy.w!==w)return;var l=LS.diy.lit;popBig(Object.keys(l).length?comp(l):'');if(add&&ps.every(function(q){return l[q]}))reward(w)};
 if(add)fly(t,LS.slow?750:420).then(upd);else upd();
 if(!add)return;
 var a=[lp(w[k])],unit=['r','u','f','v'].filter(function(q){return w[q]}).every(function(q){return lit[q]});
 if(all)a.push(w.id);
 else if(unit&&'rufv'.indexOf(k)>=0&&(w.u||w.f||w.v))a.push(unitPath(w));
 else if(unit&&k==='s'){var c=comp(lit);a.push(c===w.c?w.id:'audio/syl/'+hx(c)+'.mp3')}
 var rate=LS.slow?0.7:1,my=tok,q=Promise.resolve();
 a.forEach(function(p){q=q.then(function(){if(my!==tok)return;return play(p,rate).then(function(ok){return wait(ok?(LS.slow?500:200):0)})})})}
function build(w){LS.diy=null;clearTimeout(timer);stopAll();var my=++tok,cur={},st=[],keys=['r','u','f','v','p','s','x'].filter(function(k){return w[k]}),nm={};
 ROLES.forEach(function(r){nm[r[0]]=r[2]});
 keys.forEach(function(k,i){cur[k]=w[k];var t=comp(cur),a=[lp(w[k])],rest=keys.slice(i+1);
  if('rufv'.indexOf(k)>=0&&!rest.some(function(q){return'ufv'.indexOf(q)>=0})&&(w.u||w.f||w.v))a.push(unitPath(w));
  if(k==='s')a.push(t===w.c?w.id:'audio/syl/'+hx(t)+'.mp3');
  if(i===keys.length-1&&a[a.length-1]!==w.id)a.push(w.id);
  st.push({k:k,t:t,a:a,l:(i+1)+' \u00B7 + '+nm[k]+' '+(k==='v'?'\u25CC'+w[k]:w[k])+(k==='s'&&SN[w[k]]?' \u2014 '+SN[w[k]]:'')})});
 var rate=LS.slow?0.7:1,p=Promise.resolve();
 document.querySelectorAll('#lrow .lt').forEach(function(x){x.classList.remove('on','now')});popBig('');
 st.forEach(function(s){p=p.then(function(){if(my!==tok)return;$('stepT').textContent=s.l;
  document.querySelectorAll('#lrow .lt').forEach(function(x){x.classList.remove('now');if(x.dataset.k===s.k)x.classList.add('on','now')});
  var any=0,q=Promise.resolve(),fl=fly(document.querySelector('#lrow .lt[data-k="'+s.k+'"]'),LS.slow?900:450).then(function(){if(my===tok)popBig(s.t)});
  s.a.forEach(function(path){q=q.then(function(){if(my!==tok)return;return play(path,rate).then(function(ok){if(ok)any=1;return wait(ok?(LS.slow?700:300):0)})})});
  return Promise.all([q,fl]).then(function(){if(my!==tok)return;if(!any)$('stepT').textContent=s.l+'  \uD83D\uDD07 (audio not recorded yet)';return wait(any?(LS.slow?900:400):(LS.slow?2600:1200))})})});
 p.then(function(){if(my===tok){document.querySelectorAll('#lrow .lt').forEach(function(x){x.classList.remove('now')});popBig(w.c,1);$('stepT').textContent=w.m||'Whole syllable'}})}
$('learn').onclick=function(e){var b=e.target.closest('[data-t],[data-l],.chip');if(!b)return;
 if(b.dataset.t){LS.t=b.dataset.t;return renderLearn()}if(b.dataset.l!==undefined){LS.l=+b.dataset.l;return renderLearn()}
 pick(b)};
renderLearn();
/* ---- GAME ---- */
var G={};
function gameMenu(){var o='<option value="all">All stacks</option>',lo='<option value="0">All levels</option>';CATS.forEach(function(c){o+='<option value="'+c.k+'">'+c.dz+' \u00B7 '+c.en+'</option>'});
 for(var l=1;l<=5;l++)lo+='<option value="'+l+'">Level '+l+' \u00B7 '+LV[l]+'</option>';
 $('game').innerHTML='<div class="card" style="text-align:center"><h2 style="margin-bottom:.6rem">Spell the Stack</h2><p style="color:var(--mut);margin-bottom:1rem">Read the hint, then put each letter in its place to spell the syllable. Learn the stacks first in tab 1.</p>'+
  '<p style="margin-bottom:.6rem"><select id="gc">'+o+'</select></p><p style="margin-bottom:1rem"><select id="gl">'+lo+'</select></p><button class="btn pri" id="gs" type="button" style="font-size:1.2rem">Start &#9654;</button></div>';
 $('gs').onclick=function(){var c=$('gc').value,l=+$('gl').value,pool=W.filter(function(w){return(c==='all'||w.t===c)&&(!l||w.l===l)&&!w.rare});
  if(!pool.length)return toast('No syllables here');G.q=shuf(pool).slice(0,6);G.i=0;G.sc=0;nextQ()}}
function nextQ(){if(G.i>=G.q.length)return endG();var w=G.q[G.i];G.w=w;G.tries=0;G.sel=null;G.lock=false;G.fill={};G.msg=null;G.res=null;
 var need=parts(w).map(function(r){return r[0]}),tc=[],tv=[],n=0;
 need.forEach(function(k){var t={id:'t'+(n++),ch:w[k],kind:k==='v'?'v':'c'};(t.kind==='v'?tv:tc).push(t)});
 var used=need.map(function(k){return w[k]});
 shuf(CONS.filter(function(c){return used.indexOf(c)<0})).slice(0,3).forEach(function(c){tc.push({id:'t'+(n++),ch:c,kind:'c'})});
 if(w.v||Math.random()<.5)shuf(VOW.filter(function(c){return c!==w.v})).slice(0,1).forEach(function(c){tv.push({id:'t'+(n++),ch:c,kind:'v'})});
 G.tc=shuf(tc);G.tv=shuf(tv);G.need=need;drawQ()}
function drawQ(){var w=G.w,o={};G.need.forEach(function(k){if(G.fill[k])o[k]=G.fill[k].ch});
 var S='';parts(w).forEach(function(r){var t=G.fill[r[0]],st=G.res?(G.res[r[0]]?'good':'bad'):'';
  S+='<div class="slot'+(t?' fill':'')+' '+st+'" data-k="'+r[0]+'"><div class="box">'+(t?(r[0]==='v'?'\u25CC':'')+t.ch:'')+'</div><span class="dz">'+r[1]+'</span><small>'+r[2]+'</small></div>'});
 function tr(a){return a.map(function(t){var u=Object.keys(G.fill).some(function(k){return G.fill[k]===t});
  return'<button class="tile'+(u?' used':'')+(G.sel===t?' sel':'')+'" data-t="'+t.id+'">'+(t.kind==='v'?'\u25CC':'')+t.ch+'</button>'}).join('')}
 $('game').innerHTML='<div class="card"><div class="top"><span>Word '+(G.i+1)+' of '+G.q.length+' · Score '+G.sc+'</span><span><button class="btn" id="hq" type="button">&#128266; Hear it</button></span></div>'+
  '<div class="prev" id="pv">'+(o.r?comp(o):'')+'</div><div class="hint">Meaning: <b>'+w.h+'</b></div><div class="slots" id="sl">'+S+'</div>'+
  '<div class="tray" id="tc">'+tr(G.tc)+'</div><div class="tray" id="tv">'+tr(G.tv)+'</div><div class="fb" id="fb"></div>'+
  '<div class="row"><button class="btn pri" id="chk" type="button" disabled>Check &#10003;</button><button class="btn hidden amb" id="nx" type="button">Next &#9654;</button></div></div>';
 $('hq').onclick=function(){hear(w.id)};
 $('chk').disabled=G.need.some(function(k){return !G.fill[k]})||G.lock;
 $('chk').onclick=check;$('nx').onclick=function(){G.i++;G.res=null;nextQ()};
 if(G.lock)$('nx').classList.remove('hidden');
 if(G.msg){$('fb').textContent=G.msg[0];$('fb').className='fb '+G.msg[1]}
 [$('tc'),$('tv')].forEach(function(el){el.onclick=function(e){var b=e.target.closest('.tile');if(!b||G.lock)return;
  var t=G.tc.concat(G.tv).filter(function(x){return x.id===b.dataset.t})[0];G.sel=(G.sel===t?null:t);G.msg=null;G.res=null;drawQ()}});
 $('sl').onclick=function(e){var s=e.target.closest('.slot');if(!s||G.lock)return;var k=s.dataset.k;G.res=null;G.msg=null;
  if(G.sel){var ok=(k==='v')===(G.sel.kind==='v');if(!ok){s.classList.add('shake');toast(k==='v'?'This slot needs a vowel':'This slot needs a letter, not a vowel');return}
   G.fill[k]=G.sel;G.sel=null}else if(G.fill[k])delete G.fill[k];drawQ()}}
function check(){var w=G.w,res={},all=true;
 G.need.forEach(function(k){res[k]=G.fill[k].ch===w[k];if(!res[k])all=false});G.tries++;
 if(all){G.sc++;celebrate();G.lock=true;G.res=res;G.msg=['\u2714 Well done! '+comp(w),'ok'];return drawQ()}
 if(G.tries>=2){G.lock=true;G.need.forEach(function(k){G.fill[k]={ch:w[k]}});G.res={};G.need.forEach(function(k){G.res[k]=true});
  G.msg=['\u2716 This is the correct spelling: '+comp(w),'bad'];return drawQ()}
 G.need.forEach(function(k){if(!res[k])delete G.fill[k]});G.res=res;
 G.msg=['\u2716 Not quite. Put the right letter in the red boxes, then check again.','bad'];drawQ()}
function endG(){var n=G.q.length,st=Math.round(3*G.sc/n);
 $('game').innerHTML='<div class="card" style="text-align:center"><h2>Well done!</h2><p class="stars">'+'\u2605'.repeat(st)+'\u2606'.repeat(3-st)+'</p><p style="margin:.6rem 0 1rem">You spelled '+G.sc+' out of '+n+' correctly.</p>'+
  '<button class="btn pri" id="ag" type="button">Play again</button> <button class="btn" id="mn" type="button">Choose group</button></div>';
 $('ag').onclick=function(){G.i=0;G.sc=0;G.q=shuf(G.q);nextQ()};$('mn').onclick=gameMenu}
</script></body></html>
